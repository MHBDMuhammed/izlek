name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0de8e54994d954d65b8ea84d0f7b0d2a1619e4444
      - uses: pnpm/action-setup@41ff0909d59d5785257ffbc851021972b0570f8c1fa
        with:
          version: 12.4.1
      - uses: actions/setup-node@1a4442cacd436585af221b3dbfbfc9e799b8f32235
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e --project=chromium
